name: Pull Request Workflow

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: diggsweden/reusable-ci/.github/workflows/pullrequest-orchestrator.yml@dc5d89991e5013e2f59d19e282a9220fedda539a # main (setup-android v4)
    permissions:
      contents: read
      packages: read
      security-events: write
    secrets:
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    with:
      reusable-ci-ref: dc5d89991e5013e2f59d19e282a9220fedda539a
      project-type: gradle
      # Use devbase-check linting (replaces megalint, commitlint, licenselint)
      linters.devbasecheck: true
      linters.megalint: false
      linters.commitlint: false
      linters.licenselint: false
      linters.publiccodelint: false

  test:
    needs: [pr-checks]
    if: always()
    secrets:
      SECRETS_PROPERTIES_BASE64: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test.yml
