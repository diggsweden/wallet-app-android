name: Release Dev Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build Android app with signing
  build:
    uses: diggsweden/reusable-ci/.github/workflows/build-gradle-android.yml@997d7dc2238b40c79798fda309d8061b0707a3e5 # v3.0.0
    permissions:
      contents: read
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SECRETS_PROPERTIES_BASE64: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}
    with:
      reusable-ci-ref: 997d7dc2238b40c79798fda309d8061b0707a3e5
      java-version: "21"
      build-module: app
      product-flavor: demo
      build-types: release
      include-aab: true
      enable-signing: true
      artifact-name-prefix: dev
      include-date-stamp: false

  # Publish to Google Play internal track
  publish-google-play:
    needs: build
    uses: diggsweden/reusable-ci/.github/workflows/publish-google-play.yml@997d7dc2238b40c79798fda309d8061b0707a3e5 # v3.0.0
    permissions:
      contents: read
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    with:
      reusable-ci-ref: 997d7dc2238b40c79798fda309d8061b0707a3e5
      aab-artifact-name: ${{ needs.build.outputs.aab-name }}
      package-name: "se.digg.wallet.demo"
      track: "internal"
      status: "completed"
